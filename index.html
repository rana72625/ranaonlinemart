<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rana Online Mart - Madaripur, Bangladesh</title>
<style>
body{font-family:Arial;background:#fefcf6;margin:0}
.header{background:#fff;padding:12px;position:sticky;top:0;box-shadow:0 2px 5px #0001;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;color:#1a5c3a;font-size:20px}
.cat{display:flex;gap:10px;overflow:auto;padding:10px}
.cat div{background:#fff;padding:10px 15px;border-radius:12px;white-space:nowrap;border:1px solid #ddd}
.cat.active{background:#1a5c3a;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;padding:8px;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:140px;object-fit:cover;border-radius:10px}
.price{color:#1a5c3a;font-weight:800;font-size:18px}
.btn{background:#1a5c3a;color:#fff;border:0;width:100%;padding:8px;border-radius:8px;margin-top:5px}
.badge{background:#fff3c4;padding:8px;margin:10px;border-radius:10px;text-align:center;font-size:13px}
</style>
</head>
<body>
<div class="header">
<div class="logo">Rana Online Mart<br><small style="font-size:11px;font-weight:400">রানা অনলাইন মার্ট • Lalmohan</small></div>
<a href="admin.html" style="font-size:12px;text-decoration:none">🔧 Admin</a>
</div>

<div class="badge">🚚 Delivery charge 150৳+ in Bangladesh | bKash/Nagad/Rocket: 01842560717</div>

<div class="cat">
<div class="active">সব</div><div>পাটের ব্যাগ</div><div>মধু</div><div>নকশী কাঁথা</div>
</div>

<div class="grid" id="products"></div>

<script>
let defaultProducts=[
{name:"পাটের টোট ব্যাগ",price:850,img:"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400"},
{name:"সুন্দরবনের মধু 500g",price:600,img:"https://images.unsplash.com/photo-1587049352851-8d4e89133924?w=400"},
{name:"নকশী কাঁথা",price:2200,img:"https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=400"}
];
let extra=JSON.parse(localStorage.getItem("rana_products")||"[]");
let all=[...defaultProducts,...extra];
let box=document.getElementById("products");
all.forEach(p=>{
let wa=`https://wa.me/8801842560717?text=আসসালামু আলাইকুম ভাই, আমি ${p.name} অর্ডার করতে চাই। দাম ${p.price} টাকা`;
box.innerHTML+=`<div class="card"><img src="${p.img}"><div style="font-weight:600;margin:5px 0">${p.name}</div><div class="price">৳ ${p.price}</div><a href="${wa}" target="_blank"><button class="btn">WhatsApp অর্ডার</button></a></div>`;
});
</script>
</body>
</html>
