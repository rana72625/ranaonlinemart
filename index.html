<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rana Online Mart - সবাই দেখবে</title><style>body{margin:0;background:#f0f2f5;font-family:Arial}.top{background:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1);position:sticky;top:0;z-index:10}.logo{color:#f57224;font-weight:bold;font-size:20px}.admin-btn{background:#1877f2;color:white;border:none;padding:6px 12px;border-radius:6px;font-size:12px;text-decoration:none}.wrap{max-width:600px;margin:auto;padding:10px}.card{background:white;border-radius:10px;padding:10px;margin-bottom:10px;display:flex;gap:10px}.card img{width:90px;height:90px;object-fit:cover;border-radius:8px}.card b{font-size:15px}.price{color:#f57224;font-weight:bold;margin-top:4px}.order{background:#25D366;color:white;border:none;padding:8px 14px;border-radius:20px;margin-top:8px;font-weight:bold;width:100%}</style></head><body>
<div class="top"><div class="logo">Rana Mart</div><a class="admin-btn" href="admin.html">🔐 Admin</a></div>
<div class="wrap"><h3 style="margin:10px 5px">🛍️ আমাদের পণ্য - সবাই দেখতে পারবে</h3><div id="list"></div></div>
<script>
let defaultProducts=[
{n:"প্রিমিয়াম টি-শার্ট",p:550,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},
{n:"জিন্স প্যান্ট",p:1200,img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=400"},
{n:"চামড়ার জুতা",p:1850,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"}
];
let localPros=JSON.parse(localStorage.getItem('rana_products')||'[]');
let all=[...localPros,...defaultProducts];
let box=document.getElementById('list');
let h='';
all.forEach(x=>{
h+=`<div class="card"><img src="${x.img}"><div style="flex:1"><b>${x.n}</b><div class="price">৳ ${x.p}</div><button class="order" onclick="order('${x.n}','${x.p}')">📱 অর্ডার করুন</button></div></div>`;
});
box.innerHTML=h;
function order(n,p){let msg=`আসসালামু আলাইকুম! আমি ${n} (৳${p}) অর্ডার করতে চাই - Rana Mart`;window.open(`https://wa.me/8801XXXXXXXXX?text=${encodeURIComponent(msg)}`,'_blank');}
</script></body></html>
