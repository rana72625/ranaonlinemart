<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><style>body{margin:0;background:#f5f5f5;font-family:Arial}.box{background:white;width:92%;max-width:380px;margin:80px auto;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center}.box input{width:100%;padding:14px;margin-top:16px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:15px}.btn{width:100%;padding:14px;margin-top:12px;border:none;border-radius:8px;color:white;font-weight:bold;font-size:15px} #main{display:none;max-width:500px;margin:auto;padding:12px}.card{background:white;padding:15px;border-radius:10px;margin-top:10px}</style></head><body>
<div id="login"><div class="box"><h2 style="color:#f57224;margin:0">🔐 Admin Login</h2><p style="font-size:13px;color:#666;margin-top:6px">শুধু মালিকের জন্য</p><input id="pw" type="password" placeholder="পাসওয়ার্ড দিন"><button onclick="login()" class="btn" style="background:#f57224">লগইন করুন</button><button onclick="location.href='index.html'" class="btn" style="background:#fff;color:#333;border:1px solid #ddd">দোকানে ফিরে যান</button></div></div>
<div id="main"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">📦 পণ্য যোগ করুন</h3><button onclick="logout()" style="background:#eee;border:none;padding:6px 10px;border-radius:6px">Logout</button></div><input id="n" placeholder="পণ্যের নাম" style="width:100%;padding:12px;margin-top:12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box"><input id="p" type="number" placeholder="দাম (যেমন 850)" style="width:100%;padding:12px;margin-top:8px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box"><input type="file" id="f" accept="image/*" style="margin-top:10px"><div id="pv"></div><button onclick="addPro()" style="width:100%;padding:12px;margin-top:10px;background:#f57224;color:white;border:none;border-radius:8px;font-weight:bold">✅ পাবলিশ করুন</button><button onclick="location.href='index.html'" style="width:100%;padding:10px;margin-top:8px;background:#42b72a;color:white;border:none;border-radius:8px">🏠 দোকান দেখুন</button><div id="ls" style="margin-top:12px"></div></div></div>
<script>
const PASS="Rlrs72472@";
function login(){let v=document.getElementById('pw').value.trim();if(v===PASS){localStorage.setItem('admin_ok','yes');document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';show();}else{alert('ভুল পাসওয়ার্ড!');}}
if(localStorage.getItem('admin_ok')==='yes'){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';}
function logout(){localStorage.removeItem('admin_ok');location.reload();}
let pros=JSON.parse(localStorage.getItem('rana_products')||'[]');let img='';
document.getElementById('f').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=ev=>{img=ev.target.result;document.getElementById('pv').innerHTML=`<img src="${img}" style="width:100%;border-radius:8px;margin-top:8px">`;};r.readAsDataURL(file);});
function addPro(){let nm=document.getElementById('n').value;let pr=document.getElementById('p').value;if(!nm||!pr){alert('নাম ও দাম দিন');return;}let im=img||'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400';pros.unshift({n:nm,p:pr,img:im});localStorage.setItem('rana_products',JSON.stringify(pros));alert('✅ দারাজের মতো পাবলিশ হয়েছে!');document.getElementById('n').value='';document.getElementById('p').value='';img='';document.getElementById('pv').innerHTML='';show();}
function show(){let h='';pros.forEach((x,i)=>{h+=`<div style="display:flex;gap:8px;padding:8px;border-bottom:1px solid #eee"><img src="${x.img}" style="width:50px;height:50px;border-radius:6px;object-fit:cover"><div style="flex:1"><b>${x.n}</b><br><span style="color:#f57224">৳${x.p}</span></div><button onclick="pros.splice(${i},1);localStorage.setItem('rana_products',JSON.stringify(pros));show()" style="background:red;color:white;border:none;padding:4px 8px;border-radius:4px">X</button></div>`});document.getElementById('ls').innerHTML=h;}
show();
</script></body></html>
