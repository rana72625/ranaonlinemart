<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rana Online Mart - Daraz Style</title><style>body{margin:0;background:#f5f5f5;font-family:Arial}.header{background:#f57224;padding:10px 15px;color:white;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}.header b{font-size:18px}.admin-link{background:white;color:#f57224;padding:5px 10px;border-radius:15px;font-size:11px;text-decoration:none;font-weight:bold}.wrap{max-width:600px;margin:auto;padding:10px}.card{background:white;border-radius:8px;padding:10px;margin-bottom:10px;display:flex;gap:10px}.card img{width:90px;height:90px;object-fit:cover;border-radius:6px}.price{color:#f57224;font-weight:bold}.btn{width:100%;background:#f57224;color:white;border:none;padding:8px;border-radius:4px;margin-top:6px;font-weight:bold}.footer{background:white;margin-top:15px;padding:15px;border-radius:8px;text-align:center;font-size:13px;color:#555}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:20}.modal-box{background:white;width:92%;max-width:400px;padding:18px;border-radius:10px}.modal-box input{width:100%;padding:11px;margin-top:8px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}</style></head><body>
<div class="header"><b>🛒 Rana Online Mart</b><a class="admin-link" href="admin.html">Admin</a></div>
<div class="wrap"><div id="list"></div><div class="footer"><b>যোগাযোগ</b><br>📞 01842560717<br>📧 khanonlineb@gmail.com<br>🔵 fb.com/ranaonlinemart<br>🔴 youtube.com/@ranaonlinemart<br><br>© Rana Online Mart</div></div>
<div id="orderModal" class="modal"><div class="modal-box"><h3 style="margin:0">📝 অর্ডার করুন</h3><p id="pname" style="font-size:13px;color:#f57224"></p><input id="cname" placeholder="আপনার নাম *"><input id="cphone" placeholder="মোবাইল নাম্বার *"><input id="cemail" placeholder="জিমেইল *"><input id="caddr" placeholder="ঠিকানা"><button onclick="confirmOrder()" class="btn" style="margin-top:12px;padding:12px">✅ অর্ডার কনফার্ম করুন</button><button onclick="document.getElementById('orderModal').style.display='none'" style="width:100%;margin-top:8px;padding:10px;background:#eee;border:none;border-radius:6px">বাতিল</button></div></div>
<script>
let defaultPros=[{n:"প্রিমিয়াম টি-শার্ট",p:550,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},{n:"জিন্স প্যান্ট",p:1200,img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=400"}];
let localPros=JSON.parse(localStorage.getItem('rana_products')||'[]');
let all=[...localPros,...defaultPros];
let cur=null;
function render(){let h='';all.forEach((x,i)=>{h+=`<div class="card"><img src="${x.img}"><div style="flex:1"><b>${x.n}</b><div class="price">৳ ${x.p}</div><button class="btn" onclick="openOrder(${i})">এখনই অর্ডার করুন</button></div></div>`});document.getElementById('list').innerHTML=h;}
function openOrder(i){cur=all[i];document.getElementById('pname').innerText=cur.n+' - ৳'+cur.p;document.getElementById('orderModal').style.display='flex';}
function confirmOrder(){let n=document.getElementById('cname').value, ph=document.getElementById('cphone').value, em=document.getElementById('cemail').value, ad=document.getElementById('caddr').value;if(!n||!ph||!em){alert('নাম, মোবাইল, জিমেইল দিতে হবে');return;}let orders=JSON.parse(localStorage.getItem('rana_orders')||'[]');orders.unshift({product:cur.n,price:cur.p,customer:n,phone:ph,email:em,address:ad,time:new Date().toLocaleString('bn-BD')});localStorage.setItem('rana_orders',JSON.stringify(orders));alert('✅ অর্ডার হয়েছে ভাই! রানা ভাই আপনাকে কল দেবে');document.getElementById('orderModal').style.display='none';document.getElementById('cname').value='';document.getElementById('cphone').value='';document.getElementById('cemail').value='';document.getElementById('caddr').value='';}
render();
</script></body></html>
