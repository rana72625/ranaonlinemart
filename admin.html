<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Rana Mart</title>
<style>body{font-family:Arial;padding:15px;background:#f5f5f5}input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc}button{background:#1a5c3a;color:#fff;padding:12px;border:0;border-radius:8px;width:100%;margin-top:10px}</style></head><body>
<h2>🔧 Rana Mart Admin</h2>
<p>এখানে প্রোডাক্ট যোগ করো, ফেসবুকের মত সহজ!</p>
<input id="name" placeholder="প্রোডাক্ট নাম (যেমন: পাটের ব্যাগ)">
<input id="price" type="number" placeholder="দাম (যেমন: 850)">
<input id="img" type="file" accept="image/*">
<button onclick="add()">Add Product</button>
<button onclick="clearAll()" style="background:#c00">সব ডিলিট</button>
<a href="index.html"><button style="background:#666">দোকান দেখো</button></a>
<div id="list"></div>
<script>
function add(){
let n=document.getElementById("name").value;
let pr=document.getElementById("price").value;
let file=document.getElementById("img").files[0];
if(!n||!pr){alert("নাম দাম লিখো");return;}
if(file){
let r=new FileReader();
r.onload=e=>save(n,pr,e.target.result);
r.readAsDataURL(file);
}else save(n,pr,"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400");
}
function save(n,pr,img){
let arr=JSON.parse(localStorage.getItem("rana_products")||"[]");
arr.push({name:n,price:pr,img:img});
localStorage.setItem("rana_products",JSON.stringify(arr));
alert("যোগ হয়েছে! এখন দোকানে দেখো");
location.reload();
}
function clearAll(){localStorage.removeItem("rana_products");alert("ক্লিয়ার");location.reload();}
let arr=JSON.parse(localStorage.getItem("rana_products")||"[]");
document.getElementById("list").innerHTML=arr.map(p=>`<div style="background:#fff;padding:8px;margin:5px 0;border-radius:8px"><img src="${p.img}" style="width:50px;height:50px;object-fit:cover"> ${p.name} - ${p.price}৳</div>`).join("");
</script></body></html>
