<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Only - Rlrs72472@</title><style>body{margin:0;background:#f0f2f5;font-family:Arial} #login{position:fixed;inset:0;background:#f0f2f5;display:flex;justify-content:center;align-items:center} #box{background:white;width:90%;max-width:360px;padding:22px;border-radius:12px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.1)} #box input{width:100%;padding:12px;margin-top:12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box} #box button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;color:white;font-weight:bold} #main{display:none;max-width:500px;margin:auto;padding:12px}.card{background:white;padding:15px;border-radius:10px}</style></head><body>
<div id="login"><div id="box"><h2 style="color:#f57224;margin:0">🔐 Admin Login</h2><p style="font-size:12px;color:#666">শুধু রানা ভাই ঢুকতে পারবে</p><input id="pw" type="password" placeholder="পাসওয়ার্ড দিন"><button onclick="login()" style="background:#1877f2">লগইন করুন</button><p style="font-size:11px;color:#999;margin-top:10px">Password: Rlrs72472@</p><button onclick="location.href='index.html'" style="background:#42b72a;margin-top:6px">🏠 দোকানে ফিরে যান</button></div></div>
<div id="main"><div class="card"><h3>📝 নতুন পণ্য ছাড়ুন</h3><p style="font-size:12px;color:#666">তুমি ছাড়লে দোকানে সবাই দেখতে পারবে</p><input id="n" placeholder="পণ্যের নাম" style="width:100%;padding:12px;margin-top:10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box"><input id="p" type="number" placeholder="দাম 850" style="width:100%;padding:12px;margin-top:8px;border:1px solid #ddd;border-radius:20px;background:#f0f2f5;box-sizing:border-box"><input type="file" id="f" accept="image/*" style="margin-top:10px"><div id="pv" style="margin-top:8px"></div><button onclick="addPro()" style="width:100%;padding:12px;margin-top:10px;background:#1877f2;color:white;border:none;border-radius:8px;font-weight:bold">✅ প্রোডাক্ট ছাড়ুন</button><button onclick="location.href='index.html'" style="width:100%;padding:10px;margin-top:8px;background:#42b72a;color:white;border:none;border-radius:8px">দোকান দেখুন (সবাই দেখে)</button><button onclick="logout()" style="width:100%;padding:8px;margin-top:8px;background:#ff4444;color:white;border:none;border-radius:8px">Logout</button><div id="ls" style="margin-top:12px"></div></div></div>
<script>
const MY_PASS="Rlrs72472@";
function login(){let v=document.getElementById('pw').value;if(v===MY_PASS){localStorage.setItem('admin_ok','yes');document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';show();}else{alert('ভুল পাসওয়ার্ড! সঠিক: Rlrs72472@');}}
if(localStorage.getItem('admin_ok')==='yes'){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';}
function logout(){localStorage.removeItem('admin_ok');location.reload();}
let pros=JSON.parse(localStorage.getItem('rana_products')||'[]');let imgData='';
document.getElementById('f').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=ev=>{imgData=ev.target.result;document.getElementById('pv').innerHTML=`<img src="${imgData}" style="width:100%;border-radius:8px">`;};r.readAsDataURL(file);});
function addPro(){let nm=document.getElementById('n').value;let pr=document.getElementById('p').value;if(!nm||!pr){alert('নাম ও দাম দিন');return;}let im=imgData||'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400';pros.unshift({n:nm,p:pr,img:im});localStorage.setItem('rana_products',JSON.stringify(pros));alert('✅ ছাড়া হয়েছে! এখন দোকানে সবাই দেখতে পারবে');document.getElementById('n').value='';document.getElementById('p').value='';imgData='';document.getElementById('pv').innerHTML='';show();}
function show(){let h='';pros.forEach((x,i)=>{h+=`<div style="display:flex;gap:8px;padding:8px;border-bottom:1px solid #eee"><img src="${x.img}" style="width:50px;height:50px;object-fit:cover;border-radius:6px"><div style="flex:1"><b>${x.n}</b><br>৳${x.p}</div><button onclick="pros.splice(${i},1);localStorage.setItem('rana_products',JSON.stringify(pros));show()" style="background:red;color:white;border:none;padding:4px 8px;border-radius:4px">X</button></div>`});document.getElementById('ls').innerHTML=h;}
show();
</script></body></html>
