<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title></head><body style="margin:0;background:#f5f5f5;font-family:Arial">
<script>
if(prompt("🔐 Admin Password:")!=="Rlrs72472@"){alert("ভুল!");location.href="index.html";}
</script>
<div style="max-width:600px;margin:auto;padding:10px">
<div style="background:white;padding:12px;border-radius:8px;display:flex;justify-content:space-between"><b>👑 Rana Admin</b><a href="index.html" style="background:#f57224;color:white;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:12px">দোকান</a></div>
<div style="background:white;margin-top:10px;padding:15px;border-radius:8px"><h3 style="margin:0">➕ নতুন পণ্য ছাড়ুন</h3><input id="n" placeholder="নাম" style="width:100%;padding:10px;margin-top:8px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box"><input id="p" type="number" placeholder="দাম" style="width:100%;padding:10px;margin-top:8px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box"><input type="file" id="f" accept="image/*" style="margin-top:8px"><div id="pv"></div><button onclick="add()" style="width:100%;padding:12px;margin-top:10px;background:#f57224;color:white;border:none;border-radius:6px;font-weight:bold">পাবলিশ করুন</button></div>
<div style="background:white;margin-top:10px;padding:15px;border-radius:8px"><h3 style="margin:0">📦 কে কি অর্ডার দিলো</h3><div id="orders" style="margin-top:10px"></div></div>
</div>
<script>
let pros=JSON.parse(localStorage.getItem('rana_products')||'[]');let img='';
document.getElementById('f').addEventListener('change',e=>{let file=e.target.files[0];let r=new FileReader();r.onload=ev=>{img=ev.target.result;document.getElementById('pv').innerHTML='<img src="'+img+'" style="width:100%;border-radius:6px;margin-top:6px">'};r.readAsDataURL(file);});
function add(){let nm=document.getElementById('n').value, pr=document.getElementById('p').value;if(!nm||!pr){alert('নাম দাম দিন');return;}pros.unshift({n:nm,p:pr,img:img||'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400'});localStorage.setItem('rana_products',JSON.stringify(pros));alert('পাবলিশ হয়েছে!');document.getElementById('n').value='';document.getElementById('p').value='';}
let orders=JSON.parse(localStorage.getItem('rana_orders')||'[]');let h='';if(orders.length===0)h='<p style="color:#999;font-size:13px">এখনো কেউ অর্ডার করেনি</p>';else orders.forEach(o=>{h+=`<div style="border:1px solid #eee;padding:10px;border-radius:6px;margin-bottom:8px;font-size:13px"><b>${o.product}</b> - ৳${o.price}<br>👤 ${o.customer} | 📞 ${o.phone}<br>📧 ${o.email}<br>🏠 ${o.address}<br><small>${o.time}</small></div>`});document.getElementById('orders').innerHTML=h;
</script></body></html>
