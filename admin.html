<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title></head><body style="font-family:Arial;background:#f0f2f5;padding:20px">
<div style="background:white;max-width:400px;margin:auto;padding:20px;border-radius:10px">
<h2 style="color:#f57224;text-align:center">Rana Mart - পণ্য যোগ করুন</h2>
<input id="n" placeholder="নাম" style="width:100%;padding:12px;margin-top:10px;border:1px solid #ccc;border-radius:6px">
<input id="p" placeholder="দাম" type="number" style="width:100%;padding:12px;margin-top:10px;border:1px solid #ccc;border-radius:6px">
<input id="i" placeholder="ছবির লিংক" style="width:100%;padding:12px;margin-top:10px;border:1px solid #ccc;border-radius:6px">
<button onclick="add()" style="width:100%;background:#f57224;color:white;padding:12px;border:none;border-radius:6px;margin-top:10px;font-weight:bold">পোস্ট করুন</button>
<button onclick="location.href='index.html'" style="width:100%;background:green;color:white;padding:12px;border:none;border-radius:6px;margin-top:10px">দোকানে যান</button>
<div id="l" style="margin-top:15px"></div>
</div>
<script>
let a=JSON.parse(localStorage.getItem('rana_products')||'[]');
function add(){let n=document.getElementById('n').value;let p=document.getElementById('p').value;let i=document.getElementById('i').value||'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400';if(!n||!p)return alert('নাম দাম দিন');a.unshift({n:n,p:p,img:i});localStorage.setItem('rana_products',JSON.stringify(a));alert('হয়ে গেছে!');location.reload()}
let s='';a.forEach((x,y)=>{s+=`<div style="border:1px solid #eee;padding:8px;margin-top:5px;display:flex;gap:8px"><img src="${x.img}" style="width:50px;height:50px;object-fit:cover"><div>${x.n}<br>৳${x.p}</div></div>`});document.getElementById('l').innerHTML=s;
</script></body></html>
