<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Post Product</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f0f2f5;padding:12px}.box{background:white;max-width:420px;margin:auto;padding:15px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}h2{text-align:center;color:#f57224}input,textarea{width:100%;padding:12px;margin-top:10px;border:1px solid #ddd;border-radius:8px;font-size:14px}textarea{height:70px}.btn{width:100%;padding:12px;border:none;border-radius:8px;margin-top:10px;font-weight:bold;color:white;cursor:pointer}.b1{background:#1877f2}.b2{background:#42b72a}.b3{background:#f57224}.preview{border:1px dashed #ccc;margin-top:10px;padding:10px;border-radius:8px;text-align:center}.preview img{max-width:100%;border-radius:8px;margin-top:5px}.item{display:flex;gap:10px;padding:8px;border-bottom:1px solid #eee;align-items:center}.item img{width:50px;height:50px;object-fit:cover;border-radius:6px}</style></head><body>
<div class="box">
<h2>📝 Facebook এর মতো পোস্ট করুন</h2>
<p style="text-align:center;font-size:12px;color:#666">এখানে পণ্য যোগ করলে দোকানে চলে যাবে</p>
<input id="name" placeholder="পণ্যের নাম: যেমন পাটের ব্যাগ">
<input id="price" type="number" placeholder="দাম: যেমন 850">
<textarea id="img" placeholder="ছবির লিংক পেস্ট করুন (Google থেকে Copy Image Address) - খালি রাখলে অটো ছবি আসবে"></textarea>
<div class="preview" id="prev">ছবির প্রিভিউ</div>
<button class="btn b1" onclick="post()">✅ পোস্ট করুন - দোকানে যাবে</button>
<button class="btn b2" onclick="location.href='index.html'">🏠 দোকান দেখুন</button>
<button class="btn b3" onclick="clearAll()" style="background:#666">🗑️ সব ডিলিট</button>
<div id="list" style="margin-top:15px"></div>
</div>
<script>
let products=JSON.parse(localStorage.getItem('rana_products')||'[]');
function updatePrev(){let v=document.getElementById('img').value;if(!v)v='https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400';document.getElementById('prev').innerHTML='প্রিভিউ:<br><img src="'+v+'" onerror="this.src=\'https://via.placeholder.com/300\'">';}
document.getElementById('img').addEventListener('input',updatePrev);updatePrev();
function post(){let n=document.getElementById('name').value;let p=document.getElementById('price').value;let im=document.getElementById('img').value;if(!n||!p){alert('ভাই নাম আর দাম লিখুন');return;}if(!im)im='https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400';products.unshift({n:n,p:p,img:im});localStorage.setItem('rana_products',JSON.stringify(products));alert('পোস্ট হয়ে গেছে ভাই! ✅ এখন দোকান দেখুন');document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';render();}
function render(){let l=document.getElementById('list');let h='<h4>আপনার পোস্ট:</h4>';products.forEach((pr,i)=>{h+=`<div class="item"><img src="${pr.img}"><div style="flex:1"><b>${pr.n}</b><br>৳${pr.p}</div><button onclick="del(${i})" style="background:red;color:white;border:none;padding:6px 8px;border-radius:4px">X</button></div>`});l.innerHTML=h;}
function del(i){if(confirm('ডিলিট করবেন?')){products.splice(i,1);localStorage.setItem('rana_products',JSON.stringify(products));render();}}
function clearAll(){if(confirm('সব ডিলিট করবেন?')){localStorage.removeItem('rana_products');products=[];render();}}
render();
</script></body></html>
