<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Facebook Style Post</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f0f2f5;padding:10px}.box{background:white;max-width:500px;margin:auto;border-radius:10px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.1)}.top{display:flex;gap:10px;align-items:center;margin-bottom:10px}.top img{width:40px;height:40px;border-radius:50%}.post-area textarea{width:100%;border:none;outline:none;font-size:18px;padding:10px;min-height:70px;resize:none}.price-box{display:flex;gap:8px;margin-top:10px}.price-box input{flex:1;padding:12px;border:1px solid #ddd;border-radius:20px;background:#f0f2f5}.img-btn{border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center;margin-top:10px;cursor:pointer;color:#45bd62;font-weight:bold}.preview{margin-top:10px;display:none}.preview img{width:100%;border-radius:8px;max-height:400px;object-fit:cover}.post-btn{width:100%;background:#1877f2;color:white;border:none;padding:12px;border-radius:8px;margin-top:12px;font-weight:bold;font-size:16px}.list{max-width:500px;margin:15px auto}.item{background:white;border-radius:10px;padding:12px;margin-bottom:10px;display:flex;gap:10px}</style></head><body>
<div class="box">
<div class="top"><img src="https://i.pravatar.cc/100?img=12"><div><b>Rana Mart Admin</b><br><small style="color:#666">Public • <i class="fa fa-globe"></i></small></div></div>
<div class="post-area">
<textarea id="pName" placeholder="আপনি কি বিক্রি করতে চান? পণ্যের নাম ও বিবরণ লিখুন... যেমন: পাটের ব্যাগ - হাতে তৈরি, খুব সুন্দর..."></textarea>
</div>
<div class="price-box">
<input id="pPrice" type="number" placeholder="💰 দাম: 850">
<input id="pOld" type="number" placeholder="আগের দাম: 1000 (ঐচ্ছিক)">
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<div class="img-btn" onclick="document.getElementById('fileInput').click()"><i class="fa fa-images"></i> গ্যালারি থেকে ছবি যোগ করুন</div>
<div class="preview" id="previewBox"><img id="previewImg"><p id="fileName" style="font-size:12px;color:#666;margin-top:5px"></p></div>
<button class="post-btn" onclick="createPost()"><i class="fa fa-paper-plane"></i> Facebook এর মতো পোস্ট করুন</button>
<button onclick="location.href='index.html'" style="width:100%;background:#42b72a;color:white;border:none;padding:10px;border-radius:8px;margin-top:8px"><i class="fa fa-store"></i> দোকান দেখুন</button>
</div>
<div class="list" id="postList"></div>
<script>
let products=JSON.parse(localStorage.getItem('rana_products')||'[]');
let selectedImage='';
document.getElementById('fileInput').addEventListener('change',function(e){
let file=e.target.files[0];
if(!file)return;
let reader=new FileReader();
reader.onload=function(ev){
selectedImage=ev.target.result;
document.getElementById('previewImg').src=selectedImage;
document.getElementById('previewBox').style.display='block';
document.getElementById('fileName').innerText=file.name+' ✓';
};
reader.readAsDataURL(file);
});
function createPost(){
let name=document.getElementById('pName').value;
let price=document.getElementById('pPrice').value;
let oldPrice=document.getElementById('pOld').value||price;
if(!name||!price){alert('ভাই নাম ও দাম লিখুন!');return;}
let img=selectedImage||'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=500';
let newProduct={n:name,p:price,op:oldPrice,img:img,r:'5.0 (New)'};
products.unshift(newProduct);
localStorage.setItem('rana_products',JSON.stringify(products));
alert('✅ পোস্ট হয়ে গেছে! এখন দোকানে দেখাবে');
document.getElementById('pName').value='';
document.getElementById('pPrice').value='';
document.getElementById('pOld').value='';
selectedImage='';
document.getElementById('previewBox').style.display='none';
render();
}
function render(){
let list=document.getElementById('postList');
let html='<h4 style="padding:10px">আপনার পোস্ট করা পণ্য ('+products.length+' টা):</h4>';
products.forEach((pr,i)=>{
html+=`<div class="item"><img src="${pr.img}" style="width:60px;height:60px;border-radius:8px;object-fit:cover"><div style="flex:1"><b style="font-size:14px">${pr.n.substring(0,50)}</b><br><span style="color:#f57224;font-weight:bold">৳${pr.p}</span> <small style="text-decoration:line-through;color:#999">৳${pr.op}</small></div><button onclick="delPost(${i})" style="background:#ff4d4d;color:white;border:none;width:30px;height:30px;border-radius:50%">X</button></div>`;
});
list.innerHTML=html;
}
function delPost(i){if(confirm('ডিলিট করবেন?')){products.splice(i,1);localStorage.setItem('rana_products',JSON.stringify(products));render();}}
render();
</script></body></html>
