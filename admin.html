<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Rana Mart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5;padding:10px}
.box{background:white;max-width:500px;margin:auto;border-radius:10px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
h2{text-align:center;color:#f57224;margin-bottom:10px}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:10px;font-size:14px}
textarea{height:80px}
.btn{width:100%;background:#1877f2;color:white;border:none;padding:12px;border-radius:8px;margin-top:10px;font-weight:bold;font-size:16px}
.btn2{background:#f57224}
.preview{margin-top:15px;border:1px dashed #ccc;border-radius:8px;padding:10px;text-align:center}
.preview img{max-width:100%;border-radius:8px;margin-top:8px}
.list{max-width:500px;margin:15px auto}
.item{background:white;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.item img{width:60px;height:60px;object-fit:cover;border-radius:6px}
</style></head><body>

<div class="box">
<h2>📝 নতুন পণ্য পোস্ট করুন</h2>
<p style="text-align:center;font-size:12px;color:#666">ফেসবুকের মতো এখানে লিখুন আর পোস্ট করুন</p>

<input id="name" placeholder="পণ্যের নাম লিখুন, যেমন: পাটের ব্যাগ">
<input id="price" type="number" placeholder="দাম লিখুন, যেমন: 850">
<textarea id="img" placeholder="ছবির লিংক পেস্ট করুন (Google থেকে Copy Image Link)
অথবা খালি রাখুন, সুন্দর ছবি অটো আসবে"></textarea>

<div class="preview" id="prev">ছবি প্রিভিউ এখানে দেখাবে</div>

<button class="btn btn2" onclick="post()">✅ পোস্ট করুন - দোকানে চলে যাবে</button>
<button class="btn" onclick="location.href='index.html'" style="background:#42b72a">🏠 দোকান দেখুন</button>
</div>

<div class="list" id="list"></div>

<script>
let products=JSON.parse(localStorage.getItem('rana_products'))||[];
function updatePreview(){
let link=document.getElementById('img').value;
if(!link) link='https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400';
document.getElementById('prev').innerHTML=`প্রিভিউ:<br><img src="${link}" onerror="this.src='https://via.placeholder.com/400'">`;
}
document.getElementById('img').addEventListener('input',updatePreview);
updatePreview();

function post(){
let n=document.getElementById('name').value;
let p=document.getElementById('price').value;
let i=document.getElementById('img').value;
if(!n||!p){alert('নাম আর দাম লিখুন ভাই!');return;}
if(!i) i='https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400';
products.unshift({n,p,img:i});
localStorage.setItem('rana_products',JSON.stringify(products));
alert('পোস্ট হয়ে গেছে ভাই! ✅');
document.getElementById('name').value='';
document.getElementById('price').value='';
document.getElementById('img').value='';
render();
}
function render(){
let l=document.getElementById('list');
l.innerHTML='<h3 style="padding:10px">আপনার পোস্ট করা পণ্য:</h3>';
products.forEach((pr,idx)=>{
l.innerHTML+=`<div class="item"><img src="${pr.img}"><div style="flex:1"><b>${pr.n}</b><br>৳${pr.p}</div><button onclick="del(${idx})" style="background:red;color:white;border:none;padding:6px 10px;border-radius:6px">X</button></div>`;
});
}
function del(i){products.splice(i,1);localStorage.setItem('rana_products',JSON.stringify(products));render();}
render();
</script></body></html>
